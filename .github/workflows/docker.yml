# Construeix la imatge de Wishy a cada push a updates-clara i la publica a
# GitHub Container Registry (privada). El NAS només la baixa (./deploy.sh).
name: Docker image

on:
  push:
    branches: [updates-clara]
  workflow_dispatch: # botó "Run workflow" a la pestanya Actions

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Etiquetes: "latest" (la que fa servir el NAS) i "sha-<commit>" (per tornar a una versió)
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/wishy
          tags: |
            type=raw,value=latest
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64 # el NAS és x86_64
          push: true
          provenance: false # sense entrades extra sense etiqueta al registre
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Les imatges privades compten dins dels 500 MB gratuïts (~195 MB cadascuna):
      # només es guarden les 2 últimes versions
      - uses: actions/delete-package-versions@v5
        with:
          package-name: wishy
          package-type: container
          min-versions-to-keep: 2
